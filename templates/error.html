<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error | Wendigo Music Finder</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="static/error.css">
</head>
<body>
    <body>
        <div class="container">
            <header>
                <div class="logo">Wendigo Music Finder</div>
                <p class="tagline">Oops, algo salió mal</p>
            </header>
            
            <section>
                <div class="error-container">
                    <i class="fas fa-exclamation-triangle error-icon"></i>
                    <h2 class="error-title">Ha ocurrido un error</h2>
                    <p class="error-message">{{ message }}</p>
                    
                    <a href="{{ url_for('index') }}" class="back-button">
                        <i class="fas fa-home"></i> Volver al inicio
                    </a>
                </div>
            </section>
            
            <footer>
                <p>© 2025 Wendigo Music Finder - Desarrollado con ❤️ por el equipo Wendigo Rockolla</p>
            </footer>
        </div>
    </body> 
</body>
</html>
