<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar Moods - Wendigo Music Finder</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="static/index.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">Wendigo Music Finder</div>
            <p class="tagline">Panel de Administración</p>
        </header>
        
        <section>
            <h2 class="section-title">Administrar Moods</h2>
            
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Imagen</th>
                        <th>Nombre</th>
                        <th>URL</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    {% for mood in moods %}
                    <tr>
                        <td>{{ mood.id }}</td>
                        <td>
                            <img src="{{ get_mood_image(mood.name) }}" alt="{{ mood.name }}" class="mood-thumbnail">
                        </td>
                        <td>{{ mood.name }}</td>
                        <td>{{ mood.url }}</td>
                        <td class="actions">
                            <button class="btn btn-edit">Editar</button>
                            <button class="btn btn-delete">Eliminar</button>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
            
            <a href="/" class="back-link">
                <i class="fas fa-arrow-left"></i> Volver a la página principal
            </a>
        </section>
        
        <footer>
            <p>© 2025 Wendigo Music Finder - Panel de Administración</p>
        </footer>
    </div>
</body>
</html>
